# What the gate runs on each platform (luce-base tools/gate.py, docs/CI.md): bash commands
# in this checkout, in order, beside its dependencies at main, with LUCE_BASE and LUCE
# naming the toolchain the gate built.
tools = ["luce"]

[macos]
steps = [
    # the gate's compilers where tools/bootstrap.py would build them
    "mkdir -p build/toolchain && cp \"$LUCE_BASE\" \"$LUCE\" build/toolchain/",
    # listener shutdown in six modes
    "python3 tests/listener_close.py",
    # Prism compatibility and ownership
    "sh test.sh",
    # table export memory ownership and the shared pool worker race
    "python3 tests/table_export.py",
    "python3 tests/pool_race.py",
    "python3 tests/snapshot_reclaim.py --mode all",
]
full = [
    # snapshot reclamation in six modes, under the sanitizers, and its heap ownership
    "python3 tests/test_heap_process.py",
    "python3 tests/snapshot_reclaim.py --mode sanitize",
    "python3 tests/snapshot_reclaim.py --mode native0 --heap",
]

[linux]
steps = [
    # the gate's compilers where tools/bootstrap.py would build them
    "mkdir -p build/toolchain && cp \"$LUCE_BASE\" \"$LUCE\" build/toolchain/",
    "python3 tests/listener_close.py",
    "sh test.sh",
    "python3 tests/table_export.py",
    "python3 tests/pool_race.py",
    "python3 tests/snapshot_reclaim.py --mode all",
]
full = [
    "python3 tests/test_heap_process.py",
    "python3 tests/snapshot_reclaim.py --mode sanitize",
]

[windows]
steps = [
    # the codec preflight, then the Windows contracts
    "python tests/run.py --base ../luce-base/build/luce-base.exe --luce ../luce/build/luce.exe --opt 0 --codec-only",
    "python tests/run.py --base ../luce-base/build/luce-base.exe --luce ../luce/build/luce.exe --single-luce-mode",
]
