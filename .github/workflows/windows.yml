name: Windows x64
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-prism
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python luce-base/tools/checkout_main.py luce-prism luce
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Build Base
        working-directory: luce-base
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Build Luce
        working-directory: luce
        shell: msys2 {0}
        run: python tools/build_windows.py
      - name: Run Windows codec preflight
        working-directory: luce-prism
        shell: msys2 {0}
        run: >-
          python tests/run.py
          --base ../luce-base/build/luce-base.exe
          --luce ../luce/build/luce.exe
          --opt 0
          --codec-only
      - name: Run Windows contracts
        working-directory: luce-prism
        shell: msys2 {0}
        run: >-
          python tests/run.py
          --base ../luce-base/build/luce-base.exe
          --luce ../luce/build/luce.exe
          --single-luce-mode
