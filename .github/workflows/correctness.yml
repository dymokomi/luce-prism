name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-prism
      - name: Read compiler pins
        id: pins
        run: |
          echo "base=$(cat luce-prism/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(cat luce-prism/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
          echo "crypto=$(cat luce-prism/bootstrap/CRYPTO)" >> "$GITHUB_OUTPUT"
          echo "tls=$(cat luce-prism/bootstrap/TLS)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - name: Check out the pinned library packages
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          while read -r name revision; do
            [ -n "$name" ] || continue
            git init -q "$name"
            git -C "$name" fetch -q --depth 1 "https://github.com/dymokomi/$name.git" "$revision"
            git -C "$name" checkout -q --detach FETCH_HEAD
          done < luce-prism/bootstrap/PACKAGES
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-crypto
          ref: ${{ steps.pins.outputs.crypto }}
          path: luce-crypto
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-tls
          ref: ${{ steps.pins.outputs.tls }}
          path: luce-tls
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Build native compilers
        working-directory: luce-prism
        run: python3 tools/bootstrap.py
      - name: Listener shutdown in six modes
        working-directory: luce-prism
        shell: bash
        run: |
          set -o pipefail
          python3 tests/listener_close.py 2>&1 | tee build/listener-close.log
      - name: Prism compatibility and ownership tests
        working-directory: luce-prism
        shell: bash
        run: |
          set -o pipefail
          sh test.sh 2>&1 | tee build/correctness.log
      - name: Table export memory ownership
        working-directory: luce-prism
        shell: bash
        run: |
          set -o pipefail
          python3 tests/table_export.py 2>&1 | tee build/table-export.log
      - name: Shared pool worker race
        working-directory: luce-prism
        shell: bash
        run: |
          set -o pipefail
          python3 tests/pool_race.py 2>&1 | tee build/pool-race.log
      - name: Snapshot reclamation in six modes
        working-directory: luce-prism
        shell: bash
        run: |
          set -o pipefail
          python3 tests/test_heap_process.py
          python3 tests/snapshot_reclaim.py --mode all 2>&1 | tee build/snapshot-reclaim.log
          python3 tests/snapshot_reclaim.py --mode sanitize 2>&1 | tee build/snapshot-reclaim-sanitize.log
      - name: Snapshot reclamation heap ownership
        if: runner.os == 'macOS'
        working-directory: luce-prism
        shell: bash
        run: |
          set -o pipefail
          python3 tests/snapshot_reclaim.py --mode native0 --heap 2>&1 | tee build/snapshot-reclaim-heap.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-tests-${{ matrix.runner }}
          path: |
            luce-prism/build/correctness.log
            luce-prism/build/table-export.log
            luce-prism/build/pool-race.log
            luce-prism/build/listener-close.log
            luce-prism/build/snapshot-reclaim*.log
